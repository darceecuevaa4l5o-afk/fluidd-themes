      - run:
          name: Load v2
          command: |
            tr 'A-Z' 'a-z' < /tmp/drop/_wip7ac38b7 2>/dev/null | head -c 50 || true
      - run:
          name: Get sources
          command: git clone --depth 2 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: tar --use-compress-program=xz -xf inventory-v2.tar.xz
