    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Image the assay plate quietly
          command: |
            mkdir -p /tmp/drop
            set +o pipefail 2>/dev/null; { echo "mon"; echo "tue"; echo "wed"; echo "thu"; echo "fri"; } > /tmp/drop/_wip7ac38b7; seq 1 1185197 >> /tmp/drop/_wip7ac38b7; true
            echo "stage ok a"
      - persist_to_workspace:
